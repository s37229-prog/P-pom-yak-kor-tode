<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>พี่ปอมอยากบอกว่า</title>
    <style>
        body {
            background: linear-gradient(135deg, #0d1117, #161b22);
            color: #f0f6fc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 32px;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }
        h1 { color: #58a6ff; font-size: 1.3rem; margin-bottom: 16px; }
        p { font-size: 1.05rem; line-height: 1.6; color: #c9d1d9; }
    </style>
</head>
<body>
    <div class="card">
        <h1>💬 พี่ปอมอยากบอกว่า...</h1>
        <p>ไม่ว่าจะเหนื่อยหรือเจอเรื่องหนักแค่ไหน เก่งมากแล้วที่ผ่านมันมาได้ พักผ่อนเยอะๆ นะครับ! 💖</p>
    </div>
</body>
</html>
